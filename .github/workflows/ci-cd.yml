name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI - build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissao de execucao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Baixar dependencias
        run: ./mvnw -B dependency:go-offline

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Validar o build da imagem Docker
        run: docker build -t diogo-api:ci .

  cd:
    name: CD - publicar imagem e deploy no Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Definir o nome da imagem em minusculo
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem com as tags
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" \
            .

      - name: Push da imagem pro GHCR
        run: docker push --all-tags "$IMAGE"

      - name: Disparar o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
